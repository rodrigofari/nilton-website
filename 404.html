<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0B1A2E">

  <title>Page not found — Madeira Surf Progress</title>
  <meta name="description" content="This page does not exist. Choose a language to continue.">

  <!-- Cloudflare Pages serves this file, with a real 404 status, for any path
       that matches no asset. Without it Pages fell back to the root
       language-picker AND returned HTTP 200, so every mistyped or fabricated
       URL was a valid indexable page with duplicate content. Verified before:
       /nao-existe -> 200. Confirmed by the GEO audit (2026-07-26) as issue C2.

       noindex is belt-and-braces. A correct 404 status already keeps this out
       of the index; the meta tag covers the case where a crawler reaches the
       body through a soft-404 path. There is no canonical here on purpose —
       a 404 must not claim to be another page. -->
  <meta name="robots" content="noindex, follow">

  <link rel="icon" href="/assets/images/icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/images/icons/favicon-16x16.png">

  <link rel="apple-touch-icon" href="/assets/images/icons/apple-touch-icon.png">

  <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/Fraunces-Variable.woff2" crossorigin>

  <link rel="stylesheet" href="/styles/utilities-v2.css">

</head>
